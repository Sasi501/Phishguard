<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhishGuard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      /* Deep Dark Hacker Aesthetic Variables */
      --color-base-bg: #030305;
      --color-glass-bg: rgba(5, 5, 8, 0.65);
      --color-glass-border: rgba(0, 229, 255, 0.15);
      
      --color-neon-cyan: #00e5ff;
      --color-neon-crimson: #ff003c;
      --color-neon-amber: #ffaa00;
      --color-neon-green: #39ff14;
      
      --color-text-main: #e0e0e0;
      --color-text-muted: #8b949e;
      
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Status Mappings */
      --safe:       var(--color-neon-green);
      --suspicious: var(--color-neon-amber);
      --phishing:   var(--color-neon-crimson);
      --loading:    var(--color-neon-cyan);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 400px;
      background: var(--color-base-bg);
      color: var(--color-text-main);
      font-family: var(--font-body);
      overflow: hidden;
      position: relative;
    }

    /* Faint hexagonal background */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: -1;
      pointer-events: none;
    }

    .glass-card {
      background: var(--color-glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--color-glass-border);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      background: linear-gradient(180deg, rgba(0,229,255,0.05) 0%, transparent 100%);
    }
    .logo-icon {
      width: 24px; height: 24px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px var(--color-neon-cyan));
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--color-neon-cyan);
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }
    .logo-text span { color: var(--color-text-main); text-shadow: none; }

    /* ── Status Card ── */
    .status-card {
      margin: 16px;
      overflow: hidden;
      animation: fade-in 0.4s ease-out;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-top {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
    }

    .status-dot {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: all 0.3s ease;
      background: rgba(0, 0, 0, 0.5);
    }
    .status-dot.safe       { color: var(--safe); box-shadow: 0 0 15px rgba(57,255,20,0.4), inset 0 0 10px rgba(57,255,20,0.2); border: 1px solid var(--safe); }
    .status-dot.suspicious { color: var(--suspicious); box-shadow: 0 0 15px rgba(255,170,0,0.4), inset 0 0 10px rgba(255,170,0,0.2); border: 1px solid var(--suspicious); }
    .status-dot.phishing   { color: var(--phishing); box-shadow: 0 0 15px rgba(255,0,60,0.4), inset 0 0 10px rgba(255,0,60,0.2); border: 1px solid var(--phishing); animation: pulse-red 2s infinite; }
    .status-dot.loading    { color: var(--loading); box-shadow: 0 0 15px rgba(0,229,255,0.4), inset 0 0 10px rgba(0,229,255,0.2); border: 1px solid var(--loading); }
    .status-dot.error      { color: var(--color-text-muted); border: 1px solid var(--color-text-muted); }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 15px rgba(255,0,60,0.4), 0 0 0 0 rgba(255,0,60,0.4); }
      50%      { box-shadow: 0 0 25px rgba(255,0,60,0.6), 0 0 0 10px rgba(255,0,60,0); }
    }

    .status-text {}
    .status-label {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .status-label.safe       { color: var(--safe); text-shadow: 0 0 8px rgba(57,255,20,0.4); }
    .status-label.suspicious { color: var(--suspicious); text-shadow: 0 0 8px rgba(255,170,0,0.4); }
    .status-label.phishing   { color: var(--phishing); text-shadow: 0 0 8px rgba(255,0,60,0.4); }
    .status-label.loading    { color: var(--loading); text-shadow: 0 0 8px rgba(0,229,255,0.4); }
    .status-label.error      { color: var(--color-text-muted); }
    
    .status-sublabel { font-size: 12px; color: var(--color-text-muted); }

    /* Confidence bar */
    .confidence-row {
      padding: 0 20px 16px;
    }
    .conf-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-muted); margin-bottom: 8px; font-family: var(--font-heading); letter-spacing: 0.1em; text-transform: uppercase; }
    .conf-val { font-family: var(--font-mono); color: var(--color-text-main); }
    .conf-track { height: 6px; background: rgba(0,0,0,0.5); border-radius: 99px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .conf-fill { height: 100%; border-radius: 99px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .conf-fill.safe       { background: var(--safe); box-shadow: 0 0 10px var(--safe); }
    .conf-fill.suspicious { background: var(--suspicious); box-shadow: 0 0 10px var(--suspicious); }
    .conf-fill.phishing   { background: var(--phishing); box-shadow: 0 0 10px var(--phishing); }
    .conf-fill.loading    { background: var(--loading); box-shadow: 0 0 10px var(--loading); width: 30% !important; animation: pulse-width 1.5s infinite alternate ease-in-out; }

    @keyframes pulse-width {
      from { width: 10%; }
      to { width: 90%; }
    }

    /* Reason (XAI Summary) */
    .reason-box {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 16px 20px;
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.6;
      background: rgba(0, 229, 255, 0.02);
      position: relative;
    }
    
    .reason-box::before {
      content: 'AI ANALYSIS //';
      display: block;
      font-family: var(--font-heading);
      font-size: 10px;
      color: var(--color-neon-cyan);
      margin-bottom: 8px;
      letter-spacing: 0.1em;
    }

    /* Signals */
    .signals-box {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 16px 20px;
    }
    .signals-title { font-family: var(--font-heading); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-muted); margin-bottom: 10px; }
    .signals-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .signal-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(255,170,0,0.1);
      border: 1px solid rgba(255,170,0,0.3);
      color: var(--suspicious);
    }
    .signal-tag.phishing {
      background: rgba(255,0,60,0.1);
      border-color: rgba(255,0,60,0.3);
      color: var(--phishing);
    }
    .signal-tag.safe {
      background: rgba(57,255,20,0.1);
      border-color: rgba(57,255,20,0.3);
      color: var(--safe);
    }

    /* Redirect evidence */
    .redirect-box {
      margin: 0 16px 16px;
      padding: 12px 14px;
    }
    .redirect-title {
      color: var(--color-neon-cyan);
      font-family: var(--font-heading);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }
    .redirect-summary {
      color: var(--color-text-main);
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .redirect-summary.warning { color: var(--color-neon-amber); }
    .redirect-summary.failed { color: var(--color-neon-crimson); }
    .redirect-destination {
      color: var(--color-text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .redirect-destination strong { color: var(--color-text-main); font-family: var(--font-body); }
    .redirect-flags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .redirect-flag {
      border: 1px solid rgba(255,170,0,0.3);
      border-radius: 4px;
      color: var(--color-neon-amber);
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 3px 6px;
    }

    /* URL preview */
    .url-box {
      margin: 0 16px 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .url-icon { width: 14px; height: 14px; fill: var(--color-text-muted); flex-shrink: 0; }
    .url-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-neon-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Footer */
    .footer {
      padding: 12px 20px;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
    }
    .footer-brand { font-family: var(--font-heading); font-size: 10px; color: var(--color-text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .footer-brand span { color: var(--color-neon-cyan); }
    .cached-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--color-neon-cyan);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--color-neon-cyan);
      text-transform: uppercase;
    }

    /* Loading spinner */
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(0,229,255,0.1);
      border-top-color: var(--color-neon-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Auth Overlay */
    .auth-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 3, 5, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 30px;
    }
    .auth-overlay h2 { 
      font-family: var(--font-heading);
      font-size: 18px; 
      margin-bottom: 24px; 
      color: var(--color-neon-cyan);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,229,255,0.3);
    }
    .auth-overlay input {
      width: 100%; padding: 12px 16px; margin-bottom: 12px;
      background: rgba(0,0,0,0.5); 
      border: 1px solid rgba(0,229,255,0.2); 
      color: var(--color-text-main);
      border-radius: 8px; 
      font-family: var(--font-mono);
      font-size: 12px;
      transition: all 0.3s ease;
    }
    .auth-overlay input:focus {
      outline: none;
      border-color: var(--color-neon-cyan);
      box-shadow: 0 0 10px rgba(0,229,255,0.2);
    }
    .auth-overlay button {
      width: 100%; padding: 12px; margin-bottom: 12px;
      background: rgba(0,229,255,0.1); 
      border: 1px solid var(--color-neon-cyan); 
      color: var(--color-neon-cyan);
      border-radius: 8px; 
      font-family: var(--font-heading);
      font-weight: 700; 
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .auth-overlay button:hover {
      background: var(--color-neon-cyan);
      color: #000;
      box-shadow: 0 0 15px rgba(0,229,255,0.4);
    }
    .auth-overlay #auth-register-btn { 
      background: transparent; 
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--color-text-muted);
    }
    .auth-overlay #auth-register-btn:hover {
      border-color: var(--color-text-main);
      color: var(--color-text-main);
      box-shadow: none;
    }
    .auth-error { font-family: var(--font-mono); color: var(--color-neon-crimson); font-size: 11px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <!-- Auth Overlay -->
  <div class="auth-overlay" id="auth-overlay" style="display:none">
    <h2>Secure Gateway</h2>
    <input type="text" id="auth-username" placeholder="USERNAME" />
    <input type="password" id="auth-password" placeholder="PASSWORD" />
    <button id="auth-login-btn">Authenticate</button>
    <button id="auth-register-btn">Initialize Account</button>
    <div class="auth-error" id="auth-error"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L3 6V12C3 17.25 7.08 22.1 12 23C16.92 22.1 21 17.25 21 12V6L12 2Z" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1.5"/>
      <path d="M9 12L11 14L15 10" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">Phish<span>Guard</span></span>
  </div>

  <!-- Status Card -->
  <div class="status-card glass-card">
    <div class="status-top">
      <div class="status-dot loading" id="status-dot">
        <div class="spinner" id="spinner"></div>
      </div>
      <div class="status-text">
        <div class="status-label loading" id="status-label">INITIALIZING</div>
        <div class="status-sublabel" id="status-sub">Interrogating target URL...</div>
      </div>
    </div>

    <div class="confidence-row" id="conf-row" style="display:none">
      <div class="conf-meta">
        <span>Threat Confidence</span>
        <span class="conf-val" id="conf-val">0%</span>
      </div>
      <div class="conf-track">
        <div class="conf-fill loading" id="conf-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="reason-box" id="reason-box" style="display:none"></div>

    <div class="signals-box" id="signals-box" style="display:none">
      <div class="signals-title">Extracted Signals</div>
      <div class="signals-list" id="signals-list"></div>
    </div>
  </div>

  <!-- URL Preview -->
  <div class="url-box glass-card" id="url-box" style="display:none">
    <svg class="url-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="url-text" id="url-text"></span>
  </div>

  <div class="redirect-box glass-card" id="redirect-box" style="display:none">
    <div class="redirect-title">Redirect Evidence</div>
    <div class="redirect-summary" id="redirect-summary"></div>
    <div class="redirect-destination" id="redirect-destination"></div>
    <div class="redirect-flags" id="redirect-flags"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-brand"><span>System</span> Online</span>
    <span class="cached-badge" id="cached-badge" style="display:none">Cache Hit</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
