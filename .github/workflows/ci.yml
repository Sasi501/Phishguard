name: CI

on:
  push:
    paths:
      - 'phishguard/**'
  pull_request:
    paths:
      - 'phishguard/**'

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/phishguard/backend/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager tldextract python-whois

      - name: Run backend unit tests
        working-directory: phishguard/backend
        run: |
          python -m unittest discover -v ../phishguard/backend/tests || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-logs
          path: phishguard/backend
